spring:
  application:
    name: backend

  # 1. Habilitar Virtual Threads (Java 21)
  threads:
    virtual:
      enabled: true

  # 2. Configuración de Base de Datos (TimescaleDB / PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_db
    username: trading_user
    password: trading_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # 3. Configuración de Cache y Key-Value (Redis)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # 4. Configuración de Event Streaming (Apache Kafka)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trading-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# 5. Puerto de la aplicación e logs
server:
  port: 8080

logging:
  level:
    root: INFO
    com.trading: DEBUG